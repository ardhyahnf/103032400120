<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
</head>
<body>
    <h1>Formulir Pendaftaran</h1>
    <form>  
        <fieldset>
            <legend>Data Peserta</legend>

            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="telepon">Nomor Telepon:</label>
            <input type="tel" id="telepon" name="telepon" required>
            <br><br>

            <label for="institusi">Institusi / Asal Sekolah:</label><br>
            <input type="text" id="institusi" name="institusi" required>
            <br><br>

            <label>Jenis Kelamin:</label><br>
            <input type="radio"
                   id="laki"
                   name="jenis_kelamin"
                   value="Laki-laki"
                   required>
            <label for="laki">Laki-laki</label>

            <input type="radio"
                   id="perempuan"
                   name="jenis_kelamin"
                   value="Perempuan">
            <label for="perempuan">Perempuan</label>

            <br><br>

            <label for="tanggal">Tanggal Lahir:</label><br>
            <input type="date" id="tanggal" name="tanggal" required>
            <br><br>

            <label>Kategori Peserta</label><br>
            <input type="radio" 
                   id="pelajar"
                   name="kategori"
                   value="Pelajar">
            <label for="pelajar">Pelajar</label>

            <input type="radio" 
                   id="mahasiswa"
                   name="kategori"
                   value="Mahasiswa">
            <label for="mahasiswa">Mahasiswa</label>

            <input type="radio" 
                   id="umum"
                   name="kategori"
                   value="Umum">
            <label for="umum">Umum</label>
        </fieldset>
        <br>

        <fieldset>
            <legend>Pilihan Kegiatan</legend>

            <input type="checkbox"
                   id="fisika"
                   name="kegiatan"
                   value="Workshop Eksperimen Fisika">
            <label for="fisika">Workshop Eksperimen Fisika</label>
            <br>

            <input type="checkbox"
                   id="data sains"
                   name="kegiatan"
                   value="Workshop Dasar Data Science">
            <label for="data sains">Workshop Dasar Data Science</label>
            <br>

            <input type="checkbox"
                   id="teknologi"
                   name="kegiatan"
                   value="Seminar Teknologi dan Masa Depan">
            <label for="teknologi">Seminar Teknologi dan Masa Depan</label>
            <br>

            <input type="checkbox"
                   id="robotika"
                   name="kegiatan"
                   value="Workshop Robotika Dasar">
            <label for="robotika">Workshop Robotika Dasar</label>
            <br>

            <input type="checkbox"
                   id="science-project"
                   name="kegiatan"
                   value="Kompetisi Science Project">
            <label for="science-project">Kompetisi Science Project</label>
            <br>

            <input type="checkbox"
                   id="data-challenge"
                   name="kegiatan"
                   value="Kompetisi Data Challenge">
            <label for="data-challenge">Kompetisi Data Challenge</label>
            <br>

            <input type="checkbox"
                   id="energi"
                   name="kegiatan"
                   value="Seminar Inovasi Energi">
            <label for="energi">Seminar Inovasi Energi</label>
            <br>

            <input type="checkbox"
                   id="ai"
                   name="kegiatan"
                   value="Seminar Kecerdasan Buatan">
            <label for="ai">Seminar Kecerdasan Buatan</label>
            <br>

            <input type="checkbox"
                   id="robotik-nusantara"
                   name="kegiatan"
                   value="Kompetisi Robotik Nusantara">
            <label for="robotik-nusantara">Kompetisi Robotik Nusantara</label>
        </fieldset>
        <br>

        <label for="kebutuhan">
            <b>Kebutuhan Khusus / Informasi Tambahan:</b>
        </label>
        <br>

        <textarea id="kebutuhan"
                  name="kebutuhan"
                  rows="4"
                  cols="50"
                  placeholder="Tuliskan kebutuhan atau informasi tambahan yang perlu diperhatikan panitia"></textarea>

        <br><br>

        <input type="submit" value="Daftar Sekarang">
    
</body>
</html>
